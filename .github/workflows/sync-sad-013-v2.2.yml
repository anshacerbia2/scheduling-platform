name: Sync SAD-013 v2.2 TDDs

on:
  push:
    branches:
      - arch/sync-sad-013-v2.2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/sync-sad-013-v2.2
      - name: Apply downstream TDD alignment
        shell: python
        run: |
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          common = [
              ('version: 1.1.0', 'version: 1.2.0'),
              ('last_reviewed: 2026-08-28', 'last_reviewed: 2026-09-09'),
          ]

          edit('docs/designs/TDD-sch-runtime-001-schedule-lifecycle-temporal-engine.md', common + [
              ('| `misfire_policy` | recurring: `SKIP`, `FIRE_ONCE`, `CATCH_UP_BOUNDED` |',
               '| `misfire_policy` | recurring: `SKIP`, `FIRE_ONCE`, `CATCH_UP_BOUNDED` |\n| `tzdata_compatibility_policy` | `FOLLOW_CURRENT` by default; bounded `PIN_UNTIL` only under an explicit compatibility window |'),
              ('A tzdata upgrade that changes future computed UTC instants is a compatibility event. Deployment is blocked until the golden corpus and differential comparison identify the affected Schedule versions and the rollout evidence is accepted.',
               'A tzdata upgrade that changes future computed UTC instants is a compatibility event. Deployment is blocked until the golden corpus and differential comparison identify the affected Schedule versions and the rollout evidence is accepted. Materialized Occurrences are immutable and never recomputed. For future non-materialized instants, `FOLLOW_CURRENT` recomputes under the promoted governed tzdata while preserving Schedule semantic/DST versions as evidence. A bounded `PIN_UNTIL` policy may preserve the previously declared tzdata behavior only through an explicit expiry/review window; indefinite civil-time pinning is prohibited.'),
              ('- tzdata upgrade golden/differential corpus',
               '- tzdata upgrade golden/differential corpus, including `FOLLOW_CURRENT` recomputation and bounded `PIN_UNTIL` behavior\n- proof that materialized Occurrences are never rewritten by tzdata promotion'),
              ('Operators can preview the exact future instants and the policy/tzdata evidence that produced them.',
               'Operators can preview the exact future instants, `tzdata_compatibility_policy`, and the policy/tzdata evidence that produced them.'),
              ('Implements SAD-013 Temporal Calculator and Schedule Domain.',
               'Implements SAD-013 v2.2 Temporal Calculator, Schedule lifecycle, and tzdata compatibility behavior.'),
          ])

          edit('docs/designs/TDD-sch-runtime-002-persistence-occurrence-materialization.md', common + [
              ('  target_id uuid NOT NULL,\n  schedule_version bigint NOT NULL CHECK (schedule_version > 0),',
               '  target_id uuid NOT NULL,\n  target_contract_id text NOT NULL,\n  target_contract_version integer NOT NULL CHECK (target_contract_version > 0),\n  target_compatibility_policy text NOT NULL,\n  service_class text NOT NULL CHECK (service_class IN (\'C1\',\'C2\',\'C3\')),\n  schedule_version bigint NOT NULL CHECK (schedule_version > 0),'),
              ('  dst_policy_version text NOT NULL,\n  dst_nonexistent text NULL,',
               '  dst_policy_version text NOT NULL,\n  tzdata_compatibility_policy text NOT NULL DEFAULT \'FOLLOW_CURRENT\',\n  tzdata_pin_until timestamptz NULL,\n  dst_nonexistent text NULL,'),
              ('  tzdata_version text NULL,\n  materialized_at timestamptz NOT NULL DEFAULT transaction_timestamp(),',
               '  tzdata_version text NULL,\n  target_contract_id text NOT NULL,\n  target_contract_version integer NOT NULL CHECK (target_contract_version > 0),\n  service_class text NOT NULL CHECK (service_class IN (\'C1\',\'C2\',\'C3\')),\n  materialized_at timestamptz NOT NULL DEFAULT transaction_timestamp(),'),
              ('Materialized Occurrences retain `schedule_version`, `recurrence_semantics_version`, `dst_policy_version`, `time_zone`, and the effective tzdata version as immutable computation evidence.',
               'Materialized Occurrences retain `schedule_version`, `recurrence_semantics_version`, `dst_policy_version`, `time_zone`, effective tzdata version, immutable target contract/version, and resolved service class as computation/dispatch evidence.'),
              ('The physical due query includes the eligibility predicate supplied by TDD-005 so scopes that have exhausted their due-rate/fairness budget are not repeatedly selected ahead of other scopes.',
               'The physical due query includes the eligibility predicate supplied by TDD-005 so scopes that have exhausted their due-rate/fairness budget are not repeatedly selected ahead of other scopes. Eligibility incorporates application/Tenant quotas and bounded Scheduling Service Class fairness/reservations; caller-controlled arbitrary priorities are never part of the claim predicate.'),
              ('3. Insert each permitted Occurrence with UUIDv7\n4. Insert one `occurrence.due` outbox record per Occurrence',
               '3. Resolve and copy the Schedule-bound immutable target contract/version and authorized service class into each Occurrence\n4. Insert each permitted Occurrence with UUIDv7\n5. Insert one `occurrence.due` outbox record per Occurrence'),
              ('5. Advance `next_due_at`, or mark one-time Schedule `COMPLETED`\n6. Commit',
               '6. Advance `next_due_at`, or mark one-time Schedule `COMPLETED`\n7. Commit'),
              ('- migration/runtime role privilege separation\n- index-plan assertions',
               '- migration/runtime role privilege separation\n- immutable target-contract/version propagation from Schedule to Occurrence/outbox\n- service-class fairness eligibility under concurrent replicas\n- index-plan assertions'),
              ('Implements SAD-013 State & Data Architecture and Due Claimer/Occurrence Materializer modules.',
               'Implements SAD-013 v2.2 State & Data Architecture, Target Contract binding persistence, and Due Claimer/Occurrence Materializer modules.'),
          ])

          edit('docs/designs/TDD-sch-runtime-004-outbox-dispatch-runtime.md', common + [
              ('    "target": {"contract": "...", "version": 1},',
               '    "target": {"contract_id": "...", "contract_version": 1},\n    "service_class": "C2",'),
              ('`dispatch_event_id` identifies one publication attempt/event; `occurrence_id` remains stable across retries and replay.',
               '`dispatch_event_id` identifies one publication attempt/event; `occurrence_id` remains stable across retries and replay. Target contract/version and service class come from immutable Occurrence evidence created during materialization; the relay may resolve current operational route metadata for that exact registered contract/version but cannot silently substitute a semantically different target version.'),
              ('Direct:\n- POST to registered target acceptance URL from target registry',
               'Direct:\n- POST to the operational route resolved for the immutable registered target contract/version carried by the Occurrence'),
              ('1. Claim bounded `PENDING`/expired `IN_FLIGHT` rows with `FOR UPDATE SKIP LOCKED`',
               '1. Claim bounded `PENDING`/expired `IN_FLIGHT` rows with `FOR UPDATE SKIP LOCKED`, respecting the authorized service-class concurrency/fairness envelope'),
              ('Target routes are resolved from registered target metadata, not Schedule input.',
               'Target routes are resolved from registered target metadata for the exact immutable contract/version carried by the Occurrence, not from Schedule input and not by silently following a replacement version.'),
              ('- duplicate publish preserving `occurrence_id`\n- unroutable/poison message',
               '- duplicate publish preserving `occurrence_id`\n- target-contract/version immutability across registry deprecation/replacement\n- service-class dispatch fairness without starvation\n- unroutable/poison message'),
              ('Implements SAD-013 Outbox Relay, Occurrence Dispatch Port, and dispatch adapters.',
               'Implements SAD-013 v2.2 Outbox Relay, immutable Target Contract dispatch, Scheduling Service Class dispatch envelope, Occurrence Dispatch Port, and adapters.'),
          ])

          edit('docs/designs/TDD-sch-runtime-005-target-registry-admission-quota.md', common + [
              ('Every Schedule targets a registered Product/Platform contract. Arbitrary URL, shell command, function body, or container image is invalid.',
               'Every Schedule targets a registered, versioned Product/Platform Target Contract. Arbitrary URL, shell command, function body, container image, or caller-selected unbounded priority is invalid.'),
              ("  enabled boolean NOT NULL,\n  target_class text NOT NULL CHECK (target_class IN ('PRODUCT','PLATFORM','NOTIFICATION')),\n  dispatch_route_ref text NOT NULL,",
               "  lifecycle_state text NOT NULL CHECK (lifecycle_state IN ('CANDIDATE','ACTIVE','DEPRECATED','RETIRED')),\n  target_class text NOT NULL CHECK (target_class IN ('PRODUCT','PLATFORM','NOTIFICATION')),\n  service_class text NOT NULL CHECK (service_class IN ('C1','C2','C3')),\n  compatibility_policy text NOT NULL,\n  replacement_target_id uuid NULL,\n  deprecated_at timestamptz NULL,\n  retire_after timestamptz NULL,\n  allow_new_bindings_until timestamptz NULL,\n  dispatch_route_ref text NOT NULL,"),
              ('Target projection is refreshed asynchronously and is not authoritative for the external owning catalog.',
               'Target projection is refreshed asynchronously and is not authoritative for the external owning catalog. The projection carries lifecycle state, immutable contract version, compatibility policy, service class, replacement hints, and retirement window needed to enforce local scheduling safety.'),
              ('1. Resolve target and verify enabled/ownership compatibility',
               '1. Resolve exact Target Contract/version and verify ownership/lifecycle compatibility; `RETIRED` is never eligible, and `DEPRECATED` accepts new bindings only when its explicit compatibility window permits'),
              ('Due fairness exposes `eligible_schedule_scopes` to the due-claim query.',
               'Due fairness exposes `eligible_schedule_scopes` to the due-claim query. Every accepted Schedule receives its service class from the registered Target profile (`C1 Critical`, `C2 Business`, `C3 Best Effort`); callers cannot elevate it. Class policy provides bounded reserved capacity/weights while application/Tenant quotas remain enforced inside each class.'),
              ('The system never lets one scope occupy all claim or relay capacity.',
               'The system never lets one scope or class occupy all claim or relay capacity. C1 capacity is protected during saturation, C2 receives normal business capacity, and C3 sheds/delays first; weighted fairness prevents indefinite starvation of lower classes.'),
              ('Under saturation, degradation order is:\n\n1. shed expensive administrative aggregations\n2. reject preview/list work above concurrency budgets\n3. reject new Schedule creates with 429\n4. preserve committed due materialization and outbox relay as long as database safety allows',
               'Under saturation, degradation order is:\n\n1. shed expensive administrative aggregations\n2. reject preview/list work above concurrency budgets\n3. constrain C3 Best Effort due work to its protected minimum and defer excess C3 backlog\n4. reject new Schedule creates with 429 according to class/scope admission policy\n5. preserve committed C1/C2 due materialization and outbox relay as long as database safety allows, while retaining bounded anti-starvation capacity for C3'),
              ('- target projection maximum age for new mutations',
               '- target projection maximum age for new mutations\n- class reservations/weights and bounded max concurrency for C1/C2/C3\n- deprecation/new-binding window and retirement reconciliation grace period'),
              ('If quota state is unavailable, already committed due work continues under last safe local bounds while new create/replay admission fails closed.',
               'If quota/class state is unavailable, already committed due work continues under last safe local bounds while new create/replay admission fails closed. A Target cannot transition operationally to `RETIRED` while unresolved active Schedule bindings remain unless those bindings are explicitly grandfathered by a bounded policy.'),
              ('- disabled target\n- arbitrary URL/command rejection',
               '- target lifecycle transitions (`ACTIVE`/`DEPRECATED`/`RETIRED`) and blocked retirement with unresolved bindings\n- arbitrary URL/command/priority rejection'),
              ('- due fairness under one noisy scope\n- replay deprioritization',
               '- due fairness under one noisy scope\n- C1/C2/C3 reserved-capacity fairness and C3 anti-starvation\n- caller service-class escalation rejection\n- replay deprioritization'),
              ('Implements SAD-013 Target Projection and Quota & Admission modules;',
               'Implements SAD-013 v2.2 Target Contract lifecycle/versioning, Scheduling Service Classes, Target Projection, and Quota & Admission modules;'),
          ])

          edit('docs/designs/TDD-sch-runtime-006-operations-reconciliation.md', common + [
              ('- target/projection version\n- recurrence/DST/tzdata evidence',
               '- target contract ID/version, lifecycle state, replacement/grandfather status, and projection version\n- Scheduling Service Class\n- recurrence/DST/tzdata evidence'),
              ('Reconciliation findings use stable codes such as `OUTBOX_MISSING`, `OCCURRENCE_PENDING_TOO_LONG`, `SCHEDULE_NEXT_DUE_INCONSISTENT`, and `QUOTA_COUNTER_DRIFT`.',
               'Reconciliation findings use stable codes such as `OUTBOX_MISSING`, `OCCURRENCE_PENDING_TOO_LONG`, `SCHEDULE_NEXT_DUE_INCONSISTENT`, `QUOTA_COUNTER_DRIFT`, `TARGET_DEPRECATED_BINDING`, `TARGET_RETIREMENT_BLOCKED`, and `SERVICE_CLASS_POLICY_DRIFT`.'),
              ('- read-only health/backlog endpoints consumed by Experience BFF',
               '- read-only health/backlog endpoints consumed by Experience BFF\n- `GET /v1/operations/target-bindings` to inventory active Schedule bindings for a target contract/version before retirement'),
              ('6. stale in-flight leases are recoverable',
               '6. stale in-flight leases are recoverable\n7. every `DEPRECATED`/retiring Target Contract has an inventory of active bound Schedules and an owner-visible disposition (`REBIND`, `CANCEL`, or bounded `GRANDFATHER`)\n8. persisted Schedule/Occurrence service class matches the authorized registered Target profile unless an explicit migration record exists'),
              ('| temporal inconsistency | report only; never rewrite Schedule policy automatically |',
               '| temporal inconsistency | report only; never rewrite Schedule policy automatically |\n| target retirement blocked | inventory bound Schedules and require owner `REBIND`, `CANCEL`, or bounded `GRANDFATHER`; never silently redirect |\n| service-class policy drift | block new escalation, report existing mismatch, and migrate only through explicit versioned policy |'),
              ('A declared broker outage suppresses duplicate symptoms but does not suppress source outbox growth/storage safety alerts.',
               'A declared broker outage suppresses duplicate symptoms but does not suppress source outbox growth/storage safety alerts. Target retirement reconciliation is lower priority than due dispatch but must complete before a non-grandfathered target version can become operationally retired.'),
              ('- target projection staleness\n- replay under duplicate delivery',
               '- target projection staleness\n- target deprecation/retirement inventory, rebind/cancel/grandfather flows, and no-silent-redirect proof\n- service-class drift and saturation fairness evidence\n- replay under duplicate delivery'),
              ('Runbooks cover DB failover, broker outage, relay backlog, due-lateness breach, tzdata compatibility rollout, stuck reconciliation, quota saturation, and target disablement.',
               'Runbooks cover DB failover, broker outage, relay backlog, due-lateness breach, tzdata compatibility rollout, stuck reconciliation, quota/service-class saturation, Target Contract deprecation/retirement/rebind, and target disablement.'),
              ('Implements SAD-013 Operations & Reconciliation and NFR sections.',
               'Implements SAD-013 v2.2 Operations & Reconciliation, Target Contract retirement, service-class observability, and NFR sections.'),
          ])
      - name: Commit synchronized TDDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/designs/TDD-sch-runtime-001-schedule-lifecycle-temporal-engine.md \
                  docs/designs/TDD-sch-runtime-002-persistence-occurrence-materialization.md \
                  docs/designs/TDD-sch-runtime-004-outbox-dispatch-runtime.md \
                  docs/designs/TDD-sch-runtime-005-target-registry-admission-quota.md \
                  docs/designs/TDD-sch-runtime-006-operations-reconciliation.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(runtime): align scheduling TDDs with SAD-013 v2.2'
          git push origin HEAD:arch/sync-sad-013-v2.2
